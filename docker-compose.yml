services:
  display-manager:
    build: .
    container_name: google-calendar-display-manager
    ports:
      - "8765:8765"
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - ./token.json:/app/token.json
      - ./images:/app/images
      - ./music:/app/music
      - ./commands.json:/app/commands.json:ro
    restart: unless-stopped
    # Optional: Command line arguments can be passed here
    # command: ["python", "run.py", "--city", "東京都"]
