<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Hiroba News Smart Monitor v1.1</title>
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0b0f14;
      --panel: rgba(255, 255, 255, 0.055);
      --panel-hover: rgba(255, 255, 255, 0.085);
      --border: rgba(255, 255, 255, 0.10);
      --border-h: rgba(255, 255, 255, 0.22);
      --blur: blur(18px);
      --text: rgba(255, 255, 255, 0.92);
      --soft: rgba(255, 255, 255, 0.55);
      --ghost: rgba(255, 255, 255, 0.28);
      --accent: #5ec4ff;
      --accent-warm: #ffb347;
      --danger: #ff4757;
      --danger-bg: rgba(255, 71, 87, 0.12);
      --danger-bdr: rgba(255, 71, 87, 0.40);
      --safe: #2ed573;
      --ticker-h: 44px;
      --left-w: 310px;
      --header-h: 0px;
    }

    html,
    body {
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      font-family: 'Noto Sans JP', sans-serif;
      color: var(--text);
    }

    #bg-wrap {
      position: fixed;
      inset: 0;
      z-index: 0;
    }

    .bg-s {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      opacity: 0;
      transition: opacity 2s ease;
    }

    .bg-s.on {
      opacity: 1;
    }

    #bg-ov {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: linear-gradient(135deg, rgba(0, 0, 0, 0.62) 0%, rgba(0, 0, 0, 0.38) 60%, rgba(0, 0, 0, 0.55) 100%);
    }

    #app {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: grid;
      grid-template-rows: var(--ticker-h) 1fr;
      grid-template-columns: var(--left-w) 1fr;
    }

    #ticker-bar {
      grid-column: 1 / -1;
      grid-row: 1;
      display: flex;
      align-items: center;
      background: rgba(0, 0, 0, 0.50);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    .ticker-label {
      flex-shrink: 0;
      padding: 0 14px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.55);
      background: rgba(255, 255, 255, 0.08);
      height: 100%;
      display: flex;
      align-items: center;
      border-right: 1px solid var(--border);
    }

    .ticker-mask {
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .ticker-mask::before,
    .ticker-mask::after {
      content: '';
      position: absolute;
      top: 0;
      bottom: 0;
      width: 32px;
      z-index: 2;
      pointer-events: none;
    }

    .ticker-mask::before {
      left: 0;
      background: linear-gradient(to right, rgba(0, 0, 0, 0.5), transparent);
    }

    .ticker-mask::after {
      right: 0;
      background: linear-gradient(to left, rgba(0, 0, 0, 0.5), transparent);
    }

    #ticker-inner {
      display: flex;
      align-items: center;
      gap: 0;
      white-space: nowrap;
      animation: ticker 80s linear infinite;
    }

    #ticker-inner:hover {
      animation-play-state: paused;
    }

    @keyframes ticker {
      from {
        transform: translateX(0)
      }

      to {
        transform: translateX(-50%)
      }
    }

    .ti {
      padding: 0 18px;
      font-size: 14px;
      color: rgba(255, 255, 255, 0.85);
      border-right: 1px solid rgba(255, 255, 255, 0.12);
      pointer-events: none;
      user-select: none;
    }

    .ti-sep {
      color: rgba(255, 255, 255, 0.20);
      font-size: 14px;
      padding: 0 4px;
    }


    #left-col {
      grid-column: 1;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      border-right: 1px solid var(--border);
      overflow: hidden;
      height: 100%;
    }

    #right-col {
      grid-column: 2;
      grid-row: 2;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 100%;
    }

    #clock-block {
      flex-shrink: 0;
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }

    #time-display {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: clamp(72px, 9vw, 96px);
      font-weight: 700;
      letter-spacing: 2px;
      line-height: 1;
      color: #fff;
    }

    #time-sep {
      opacity: 0.3;
    }

    #date-line {
      margin-top: 8px;
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.88);
      letter-spacing: 0.5px;
    }

    #reiwa-line {
      margin-top: 4px;
      font-size: 14px;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 1px;
    }

    #city-line {
      margin-top: 10px;
      font-size: 13px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.40);
    }

    #weather-now {
      flex-shrink: 0;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .wn-row {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .wn-icon {
      font-size: 52px;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.4));
    }

    .wn-temp {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 46px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
    }

    .wn-unit {
      font-size: 18px;
      opacity: 0.5;
    }

    .wn-desc {
      font-size: 16px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.85);
      margin-top: 4px;
    }

    .wn-feels {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.50);
    }

    .wn-stats {
      display: flex;
      gap: 8px;
    }

    .wn-stat {
      flex: 1;
      text-align: center;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 4px;
    }

    .wn-stat-l {
      font-size: 11px;
      letter-spacing: 0.5px;
      color: rgba(255, 255, 255, 0.45);
    }

    .wn-stat-v {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      margin-top: 2px;
    }

    .wn-stat-u {
      font-size: 9px;
      opacity: 0.5;
    }

    .cal-card {
      background: var(--panel);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 8px;
      border-left: 3px solid var(--accent);
    }

    .cal-time {
      font-size: 11px;
      color: var(--accent);
      font-weight: 700;
      margin-bottom: 4px;
    }

    .cal-summary {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      line-height: 1.4;
    }

    .cal-loc {
      font-size: 11px;
      color: var(--ghost);
      margin-top: 4px;
    }

    #calendar-today-block {
      flex: 1;
      overflow-y: auto;
      padding: 10px 12px 16px;
    }

    #calendar-today-block::-webkit-scrollbar {
      width: 3px;
    }

    #calendar-today-block::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }

    #calendar-weekly-block {
      flex: 1;
      overflow-y: auto;
      padding: 10px 14px 16px;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    #calendar-weekly-block::-webkit-scrollbar {
      width: 4px;
    }

    #calendar-weekly-block::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }

    /* ── Monthly Calendar Grid ── */
    #cal-grid-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .cal-grid-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 4px 10px;
    }

    .cal-grid-nav-title {
      font-size: 17px;
      font-weight: 700;
      color: #fff;
      letter-spacing: 1px;
    }

    .cal-grid-nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 16px;
      width: 30px;
      height: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
    }

    .cal-grid-nav-btn:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .cal-dow-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      margin-bottom: 4px;
    }

    .cal-dow {
      text-align: center;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--ghost);
      padding: 4px 0;
    }

    .cal-dow:first-child {
      color: #ff6b6b;
    }

    .cal-dow:last-child {
      color: var(--accent);
    }
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-auto-rows: 1fr;
      gap: 4px;
      flex: 1;
      min-height: 400px;
    }

    .cal-cell {
      min-height: 60px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 8px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: default;
      transition: background 0.15s;
      overflow: hidden;
      position: relative;
      pointer-events: none;
    }

    .cal-cell.today {
      background: rgba(94, 196, 255, 0.12);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(94, 196, 255, 0.2);
    }

    .cal-cell.other-month {
      opacity: 0.28;
    }

    .cal-cell.today .cal-cell-day {
      background: var(--accent);
      color: #000 !important;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .cal-cell.has-event {
      border-color: rgba(94, 196, 255, 0.28);
    }

    .cal-cell-day {
      font-size: 12px;
      font-weight: 600;
      line-height: 22px;
      color: rgba(255, 255, 255, 0.80);
    }

    .cal-cell:nth-child(7n+1) .cal-cell-day {
      color: #ff8a80;
    }

    .cal-cell.other-month .cal-cell-day {
      color: rgba(255, 255, 255, 0.35);
    }

    .cal-cell-dots {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      justify-content: center;
      margin-top: 2px;
    }

    .cal-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
    }

    .cal-dot.allday {
      background: var(--accent-warm);
    }

    /* Removed .cal-cell.selected and .cal-cell:hover as requested */

    /* Event list panel removed */
    #cal-event-panel {
      display: none;
    }

    #cal-event-panel::-webkit-scrollbar {
      width: 3px;
    }

    #cal-event-panel::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
    }

    .cal-panel-date {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--ghost);
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
      margin-bottom: 6px;
      margin-top: 8px;
    }

    .cal-panel-date:first-child {
      margin-top: 0;
    }

    .cal-week-group {
      margin-bottom: 20px;
    }

    .cal-date-header {
      font-size: 11px;
      letter-spacing: 2px;
      color: var(--ghost);
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
    }

    .loader {
      padding: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--ghost);
      animation: fp 1.4s ease-in-out infinite;
    }

    @keyframes fp {

      0%,
      100% {
        opacity: 0.3
      }

      50% {
        opacity: 1
      }
    }

    #forex-panel {
      flex-shrink: 0;
      padding: 10px 14px 10px;
      border-bottom: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.18);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .forex-updated {
      font-size: 10px;
      color: var(--ghost);
      opacity: 0.7;
    }

    .forex-cards {
      display: flex;
      gap: 7px;
    }

    .fx-card {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      min-width: 0;
    }

    .fx-pair {
      font-size: 14px;
      letter-spacing: 1px;
      color: rgba(255, 255, 255, 0.75);
      margin-bottom: 5px;
      font-weight: 600;
    }

    .fx-rate {
      font-family: 'Noto Sans JP', sans-serif;
      font-size: 20px;
      font-weight: 700;
      color: #fff;
      line-height: 1.1;
    }

    .fx-rate span {
      font-size: 11px;
      font-weight: 400;
      opacity: 0.5;
      margin-left: 1px;
    }

    .fx-change {
      font-size: 12px;
      font-weight: 600;
      margin-top: 4px;
    }

    .fx-change.up {
      color: #2ed573;
    }

    .fx-change.down {
      color: #ff4757;
    }

    .fx-change.flat {
      color: var(--ghost);
    }

    .fx-label {
      font-size: 9px;
      color: var(--ghost);
      margin-top: 2px;
      opacity: 0.7;
    }

    /* ── compact-clock mode ── */
    body.compact-clock #time-display {
      font-size: clamp(44px, 6vw, 62px) !important;
    }

    body.compact-clock #date-line {
      font-size: 13px;
    }

    body.compact-clock #reiwa-line {
      font-size: 12px;
    }

    body.compact-clock #clock-block {
      padding: 12px 16px 10px;
    }

    /* ── mouse-hide mode ── */
    body.mouse-hide,
    body.mouse-hide * {
      cursor: none !important;
    }

    /* ── drag-scroll ── */
    .drag-scroll {
      user-select: none;
    }

    .drag-scroll.dragging {
      cursor: grabbing !important;
    }

    @media (max-width: 700px) {
      :root {
        --left-w: 100vw;
      }

      #app {
        grid-template-rows: var(--ticker-h) auto 1fr;
        grid-template-columns: 1fr;
      }

      #left-col {
        grid-column: 1;
        grid-row: 2;
        max-height: 55vh;
      }

      #right-col {
        grid-column: 1;
        grid-row: 3;
      }
    }
  </style>
</head>

<body>

  <div id="bg-wrap">
    <div class="bg-s" id="bg-a"></div>
    <div class="bg-s" id="bg-b"></div>
  </div>
  <div id="bg-ov"></div>

  <div id="app">

    <div id="ticker-bar">
      <div class="ticker-label">LIVE NEWS</div>
      <div class="ticker-mask">
        <div id="ticker-inner"><span class="loader"
            style="padding:0 20px">表示されない場合、インターネット接続とJavascript、Pythonを確認してください</span></div>
      </div>
    </div>

    <div id="left-col">

      <div id="clock-block">
        <div id="time-display">
          <div style="display:flex;align-items:baseline;gap:4px"><span id="th">--</span><span
              id="time-sep">:</span><span id="tm">--</span></div>
          <div id="ts" style="font-size:0.28em;opacity:0.40;letter-spacing:2px;margin-top:2px;text-align:right">--</div>
        </div>
        <div id="date-line">----年 -月 -日（-）</div>
        <div id="reiwa-line">令和--年 / 干支 --</div>
        <div id="city-line">📍 …</div>
      </div>

      <div id="weather-now">
        <div class="loader">表示されない場合、インターネット接続とJavascript、Pythonを確認してください</div>
      </div>

      <div id="calendar-today-block" class="drag-scroll">
        <div class="weekly-label" style="padding:4px 4px 10px;">今日の予定</div>
        <div id="calendar-today-list"></div>
      </div>

    </div>

    <div id="right-col">

      <div id="forex-panel">
        <div class="forex-cards">
          <span class="forex-updated" id="forex-updated"></span>
        </div>
        <div class="forex-cards" id="forex-cards">
          <div class="loader" style="padding:8px;width:100%">表示されない場合、インターネット接続とJavascript、Pythonを確認してください</div>
        </div>
      </div>

      <div id="calendar-weekly-block" class="drag-scroll">
        <div id="cal-grid-wrap">
          <div class="cal-grid-nav">
            <button class="cal-grid-nav-btn" id="cal-prev">&#8249;</button>
            <div class="cal-grid-nav-title" id="cal-month-title">----年 -月</div>
            <button class="cal-grid-nav-btn" id="cal-next">&#8250;</button>
          </div>
          <div class="cal-dow-row">
            <div class="cal-dow">日</div>
            <div class="cal-dow">月</div>
            <div class="cal-dow">火</div>
            <div class="cal-dow">水</div>
            <div class="cal-dow">木</div>
            <div class="cal-dow">金</div>
            <div class="cal-dow">土</div>
          </div>
          <div class="cal-grid" id="cal-grid"></div>
        </div>
      </div>

    </div>

  </div>

  <script>
    'use strict';

    const DAY = ['日', '月', '火', '水', '木', '金', '土'];
    const ETOS = ['子', '丑', '寅', '卯', '辰', '巳', '午', '未', '申', '酉', '戌', '亥'];
    const JIKKAN = ['甲', '乙', '丙', '丁', '戊', '己', '庚', '辛', '壬', '癸'];

    const bgA = document.getElementById('bg-a');
    const bgB = document.getElementById('bg-b');
    let bgSide = 'a', bgList = [];

    (async () => {
      try { const r = await fetch('/api/images'); if (r.ok) bgList = await r.json(); } catch { }
      if (bgList.length) showBg();
    })();

    function showBg() {
      if (!bgList.length) return;
      const url = bgList[Math.floor(Math.random() * bgList.length)];
      const next = bgSide === 'a' ? bgB : bgA;
      const prev = bgSide === 'a' ? bgA : bgB;
      next.style.backgroundImage = `url('${url}')`;
      next.classList.add('on');
      setTimeout(() => prev.classList.remove('on'), 2100);
      bgSide = bgSide === 'a' ? 'b' : 'a';
    }
    setInterval(showBg, 30000);

    function reiwaYear(y) { return y - 2018; }

    function kanshi(y) {
      const jk = JIKKAN[(y - 4) % 10];
      const et = ETOS[(y - 4) % 12];
      return jk + et;
    }

    function tick() {
      const n = new Date();
      const y = n.getFullYear(), mo = n.getMonth() + 1, d = n.getDate();
      const hh = String(n.getHours()).padStart(2, '0');
      const mm = String(n.getMinutes()).padStart(2, '0');
      const ss = String(n.getSeconds()).padStart(2, '0');

      document.getElementById('th').textContent = hh;
      document.getElementById('tm').textContent = mm;
      document.getElementById('ts').textContent = ss;

      document.getElementById('time-sep').style.opacity = n.getSeconds() % 2 === 0 ? '1' : '0.15';

      document.getElementById('date-line').textContent =
        `${y}年 ${mo}月 ${d}日（${DAY[n.getDay()]}）`;
      document.getElementById('reiwa-line').textContent =
        `令和${reiwaYear(y)}年 / 干支 ${kanshi(y)}`;
    }
    setInterval(tick, 1000); tick();

    async function loadCalendar() {
      try {
        const todayData = await (await fetch('/api/calendar?days=1')).json();
        const monthlyData = await (await fetch('/api/calendar?days=90')).json();

        if (todayData.error || monthlyData.error) {
          throw new Error(todayData.error || monthlyData.error);
        }

        renderTodayCalendar(todayData);
        renderWeeklyCalendar(monthlyData);
      } catch (e) {
        const err = `<div class="loader">予定取得失敗: ${h(e.message)}<br><small>credentials.jsonがルートディレクトリに必要です</small></div>`;
        document.getElementById('calendar-today-list').innerHTML = err;
        document.getElementById('cal-grid').innerHTML = err;
      }
    }

    function renderTodayCalendar(events) {
      const list = document.getElementById('calendar-today-list');
      if (!events || events.length === 0) {
        list.innerHTML = '<div class="loader" style="animation:none">今日の予定はありません</div>';
        return;
      }
      list.innerHTML = events.map(ev => {
        const start = new Date(ev.start);
        const timeStr = ev.start.length > 10
          ? `${String(start.getHours()).padStart(2, '0')}:${String(start.getMinutes()).padStart(2, '0')}`
          : '終日';
        return `
      <div class="cal-card">
        <div class="cal-time">${timeStr}</div>
        <div class="cal-summary">${h(ev.summary)}</div>
        ${ev.location ? `<div class="cal-loc">📍 ${h(ev.location)}</div>` : ''}
      </div>`;
      }).join('');
    }

    // ── Monthly grid calendar ──────────────────────────────────────
    let _allEvents = {};   // { "YYYY-MM-DD": [ev,...] }
    let _gridYear = 0;
    let _gridMonth = 0;    // 0-based
    let _selDate = null; // "YYYY-MM-DD" currently highlighted

    function renderWeeklyCalendar(events) {
      // Store events indexed by date
      _allEvents = {};
      if (events && events.length) {
        events.forEach(ev => {
          const d = ev.start.slice(0, 10);
          if (!_allEvents[d]) _allEvents[d] = [];
          _allEvents[d].push(ev);
        });
      }
      // Set initial month to today
      const now = new Date();
      if (!_gridYear) { _gridYear = now.getFullYear(); _gridMonth = now.getMonth(); }
      renderGrid();
    }

    function renderGrid() {
      const today = new Date();
      const todayStr = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, '0')}-${String(today.getDate()).padStart(2, '0')}`;

      document.getElementById('cal-month-title').textContent =
        `${_gridYear}年 ${_gridMonth + 1}月`;

      const firstDay = new Date(_gridYear, _gridMonth, 1);
      const lastDay = new Date(_gridYear, _gridMonth + 1, 0);
      // Start from Sunday of the first week
      const startDate = new Date(firstDay);
      startDate.setDate(startDate.getDate() - firstDay.getDay());

      const cells = [];
      const cur = new Date(startDate);
      // Always render at least 5 rows (35 cells), 6 if needed
      const totalCells = lastDay.getDay() === 6 && firstDay.getDay() === 0 ? 42 :
        (firstDay.getDay() + lastDay.getDate() > 35 ? 42 : 35);

      for (let i = 0; i < totalCells; i++) {
        const ds = `${cur.getFullYear()}-${String(cur.getMonth() + 1).padStart(2, '0')}-${String(cur.getDate()).padStart(2, '0')}`;
        const isThisMonth = cur.getMonth() === _gridMonth;
        const isToday = ds === todayStr;
        const isSel = ds === _selDate;
        const evs = _allEvents[ds] || [];
        const hasEv = evs.length > 0;

        const dots = evs.slice(0, 3).map(ev =>
          `<div class="cal-dot${ev.start.length <= 10 ? ' allday' : ''}"></div>`
        ).join('');

        cells.push(`
      <div class="cal-cell${isThisMonth ? '' : ' other-month'}${isToday ? ' today' : ''}${hasEv ? ' has-event' : ''}"
           data-date="${ds}">
        <div class="cal-cell-day">${cur.getDate()}</div>
        ${hasEv ? `<div class="cal-cell-dots">${dots}</div>` : ''}
      </div>`);
        cur.setDate(cur.getDate() + 1);
      }

      document.getElementById('cal-grid').innerHTML = cells.join('');

      // Show events for selected date, or today if nothing selected
      // Removed renderEventPanel as it is no longer needed
    }

    // Removed selectCalDate as clicking is disabled

    // renderEventPanel removed as it is no longer needed

    document.getElementById('cal-prev').addEventListener('click', () => {
      _gridMonth--;
      if (_gridMonth < 0) { _gridMonth = 11; _gridYear--; }
      _selDate = null;
      renderGrid();
    });
    document.getElementById('cal-next').addEventListener('click', () => {
      _gridMonth++;
      if (_gridMonth > 11) { _gridMonth = 0; _gridYear++; }
      _selDate = null;
      renderGrid();
    });

    async function loadWeather() {
      try {
        const w = await (await fetch('/api/weather')).json();
        if (w.error) throw new Error(w.error);

        document.getElementById('city-line').textContent = '📍 ' + w.city;

        document.getElementById('weather-now').innerHTML = `
      <div class="wn-row">
        <div class="wn-icon">${w.icon}</div>
        <div>
          <div class="wn-temp">${w.temp}<span class="wn-unit">°C</span></div>
          <div class="wn-desc">${h(w.desc)}</div>
          <div class="wn-feels">体感 ${w.feels}°C</div>
        </div>
      </div>
      <div class="wn-stats">
        <div class="wn-stat">
          <div class="wn-stat-l">湿度</div>
          <div class="wn-stat-v">${w.humidity}<span class="wn-stat-u">%</span></div>
        </div>
        <div class="wn-stat">
          <div class="wn-stat-l">風速</div>
          <div class="wn-stat-v">${w.wind}<span class="wn-stat-u">km/h</span></div>
        </div>
        <div class="wn-stat">
          <div class="wn-stat-l">降水</div>
          <div class="wn-stat-v">${w.precip}<span class="wn-stat-u">mm</span></div>
        </div>
      </div>`;

      } catch (e) {
        document.getElementById('weather-now').innerHTML =
          `<div class="loader">天気取得失敗<br><small>${h(e.message)}</small></div>`;
      }
    }

    async function loadNews() {
      try {
        const feeds = await (await fetch('/api/news')).json();
        const all = feeds.flatMap(f => f.items || []);

        const tHtml = all.slice(0, 35).map(it =>
          `<span class="ti">▶ ${h(it.title)}</span>`
        ).join('<span class="ti-sep">●</span>');
        document.getElementById('ticker-inner').innerHTML = tHtml + '<span class="ti-sep">●</span>' + tHtml;
      } catch (e) { }
    }

    function h(s) {
      return String(s || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    const FX_PAIRS = [
      { base: 'usd', label: 'USD/JPY 米ドル/日本円' },
      { base: 'eur', label: 'EUR/JPY ユーロ/日本円' },
      { base: 'cny', label: 'CNY/JPY 人民元/日本円' },
    ];
    const fxPeriod = '1w';
    let fxData = {};

    function isoDate(offsetDays = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offsetDays);
      return d.toISOString().slice(0, 10);
    }

    async function fetchRate(dateStr, base) {
      const urls = [
        `https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@${dateStr}/v1/currencies/${base}.min.json`,
        `https://${dateStr}.currency-api.pages.dev/v1/currencies/${base}.min.json`,
      ];
      for (const url of urls) {
        try {
          const r = await fetch(url);
          if (!r.ok) continue;
          const j = await r.json();
          return j[base]['jpy'];
        } catch { }
      }
      return null;
    }

    async function loadForex() {
      const yday = isoDate(-1);
      const lastWeek = isoDate(-7);
      try {
        const bases = FX_PAIRS.map(p => p.base);
        const [lt, yd, wk] = await Promise.all([
          Promise.all(bases.map(b => fetchRate('latest', b))),
          Promise.all(bases.map(b => fetchRate(yday, b))),
          Promise.all(bases.map(b => fetchRate(lastWeek, b))),
        ]);
        fxData = { latest: {}, prev1d: {}, prev1w: {} };
        bases.forEach((b, i) => {
          fxData.latest[b] = lt[i];
          fxData.prev1d[b] = yd[i];
          fxData.prev1w[b] = wk[i];
        });
        const now = new Date();
        document.getElementById('forex-updated').textContent =
          `最終更新 ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
        renderForex();
      } catch (e) {
        document.getElementById('forex-cards').innerHTML =
          `<div class="loader" style="padding:8px;width:100%">取得失敗: ${h(e.message)}</div>`;
      }
    }

    function renderForex() {
      if (!fxData.latest) return;
      const prev = fxData.prev1w;
      const label = '前週比';
      const html = FX_PAIRS.map(p => {
        const cur = fxData.latest[p.base];
        const old = prev[p.base];
        if (cur == null) return `
      <div class="fx-card">
        <div class="fx-pair">${p.label}</div>
        <div class="fx-rate">—</div>
      </div>`;
        const diff = (old != null) ? cur - old : null;
        const pct = (old != null && old !== 0) ? (diff / old * 100) : null;
        const sign = diff > 0 ? '+' : '';
        const cls = diff == null ? 'flat' : diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
        const arrow = diff == null ? '─' : diff > 0 ? '▲' : diff < 0 ? '▼' : '─';
        const changeHtml = diff != null
          ? `<div class="fx-change ${cls}">${arrow} ${sign}${diff.toFixed(2)} (${sign}${pct.toFixed(2)}%)</div>`
          : `<div class="fx-change flat">─</div>`;
        return `
      <div class="fx-card">
        <div class="fx-pair">${p.label}</div>
        <div class="fx-rate">${cur.toFixed(2)}<span>円</span></div>
        ${changeHtml}
        <div class="fx-label">${label}</div>
      </div>`;
      }).join('');
      document.getElementById('forex-cards').innerHTML = html;
    }

    // ── apply server-injected config ──────────────────────────────
    const CFG = window.MONITOR_CONFIG || {};
    if (CFG.compactClock) document.body.classList.add('compact-clock');
    if (CFG.compactNews) document.body.classList.add('compact-news');
    if (CFG.mouseHide) document.body.classList.add('mouse-hide');

    // ── wake lock ─────────────────────────────────────────────────
    if (CFG.wakeLock && 'wakeLock' in navigator) {
      let wakeLock = null;
      async function acquireWakeLock() {
        try {
          wakeLock = await navigator.wakeLock.request('screen');
        } catch { }
      }
      // ページが再表示されたとき（タブ切替後など）に再取得
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') acquireWakeLock();
      });
      acquireWakeLock();
    }

    // ── drag / touch scroll ───────────────────────────────────────
    function enableDragScroll(el) {
      let startY = 0, startX = 0, scrollY = 0, scrollX = 0, dragging = false;

      function onDown(e) {
        dragging = true;
        startY = e.type === 'mousedown' ? e.clientY : e.touches[0].clientY;
        startX = e.type === 'mousedown' ? e.clientX : e.touches[0].clientX;
        scrollY = el.scrollTop;
        scrollX = el.scrollLeft;
        el.classList.add('dragging');
        if (e.type === 'mousedown') e.preventDefault();
      }
      function onMove(e) {
        if (!dragging) return;
        const cy = e.type === 'mousemove' ? e.clientY : e.touches[0].clientY;
        const cx = e.type === 'mousemove' ? e.clientX : e.touches[0].clientX;
        el.scrollTop = scrollY - (cy - startY);
        el.scrollLeft = scrollX - (cx - startX);
      }
      function onUp() { dragging = false; el.classList.remove('dragging'); }

      el.addEventListener('mousedown', onDown, { passive: false });
      el.addEventListener('mousemove', onMove);
      el.addEventListener('mouseup', onUp);
      el.addEventListener('mouseleave', onUp);
      el.addEventListener('touchstart', onDown, { passive: true });
      el.addEventListener('touchmove', onMove, { passive: true });
      el.addEventListener('touchend', onUp);
    }

    document.querySelectorAll('.drag-scroll').forEach(enableDragScroll);

    loadWeather();
    loadNews();
    loadForex();
    loadCalendar();
    setInterval(loadWeather, 10 * 60 * 1000);
    setInterval(loadNews, 5 * 60 * 1000);
    setInterval(loadForex, 60 * 60 * 1000);
    setInterval(loadCalendar, 5 * 60 * 1000);

    setTimeout(() => location.reload(), 6 * 60 * 60 * 1000);
  </script>
</body>
